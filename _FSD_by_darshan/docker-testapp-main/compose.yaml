services:
  mongo:
    image: mongo
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=qwert

  mongo-express:
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwert
      ME_CONFIG_MONGODB_URL: mongodb://root:qwert@mongo:27017/

  # Node application
  node-app:
    image: ajayblyth/testapp:latest   # Pull image from Docker Hub
    ports:
      - 5050:5050
    environment:
      - MONGO_DB_HOST=mongo
    depends_on:
      - mongo