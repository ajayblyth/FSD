<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css" type="text/css" />
    <title>Home Page</title>
</head>
<body>
    <h1>Hi student, Welcome to XYZ University!</h1>
    <p>You can sign up to the platform to access all important notes & lectures.</p>

    <form action="/addUser" method="POST" id="signupForm">
        <div class="field">
            <label for="email">Email: </label>
            <input type="text" id="email" placeholder="jane@email.com" name="email">
        </div>
        <div class="field">
        <label for="username">Username: </label>
            <input type="text" id="username" placeholder="Jane Doe" name="username">
        </div>
        <div class="field">
            <label for="password">Password: </label>
            <input type="password" id="password" placeholder="password" name="password">
        </div>

        <button type="submit" id="formBtn">Create Account</button>

    </form>

    //added to fetch all users
    <button id="getUsersBtn">Show Users</button>

//display fetched users here
<ul id="usersList"></ul>

    <p id="message"></p>

    <script>
        const form = document.getElementById("signupForm");
       const message = document.getElementById("message");

       //swlected new elements
const getUsersBtn = document.getElementById("getUsersBtn");
const usersList = document.getElementById("usersList");

//post
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const formData = new URLSearchParams(new FormData(form));

            try {
                const res = await fetch("/addUser", { method: "POST", body: formData });
                const data = await res.json();
                if (data.acknowledged) {
                    message.textContent = "Account created successfully!";
                    form.reset();
                } else {
                    message.textContent = "Something went wrong. Please try again.";
                }
            } catch (err) {
                message.textContent = "Could not reach the server.";
            }
        });

        //get
        getUsersBtn.addEventListener("click", async () => {

        usersList.innerHTML = "";  
        //clear old text ,Otherwise every click would keep adding duplicate users.

        try {

            const res = await fetch("/getUsers");  //browser-express-db-db responds- express
            const users = await res.json();   //back to the browser

            users.forEach(user => {

                const li = document.createElement("li");

                li.textContent = `${user.username} (${user.email})`;

                usersList.appendChild(li);

            });

        } catch (err) {

            usersList.innerHTML = "<li>Unable to fetch users</li>";

        }

    });

    </script>
</body>

</html>
